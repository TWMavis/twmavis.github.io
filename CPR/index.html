<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CPR訓練">
<link rel="manifest" href="manifest.json">
<title>CPR 姿勢訓練系統</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #FF2D2D;
    --red-dark: #C41E1E;
    --red-glow: rgba(255, 45, 45, 0.3);
    --green: #00E676;
    --green-glow: rgba(0, 230, 118, 0.3);
    --yellow: #FFD600;
    --bg: #080C0F;
    --surface: #0E1419;
    --surface2: #141B22;
    --border: rgba(255,255,255,0.08);
    --text: #E8EDF2;
    --text-dim: rgba(232,237,242,0.5);
    --font-display: 'Rajdhani', sans-serif;
    --font-body: 'Noto Sans TC', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-icon {
    width: 32px; height: 32px;
    background: var(--red);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 12px var(--red-glow);
  }
  .logo-icon svg { width: 20px; height: 20px; }
  .logo-text { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: 2px; }
  .logo-sub { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; margin-top: -2px; }

  .header-right { display: flex; gap: 8px; align-items: center; }
  .badge {
    padding: 4px 10px; border-radius: 20px;
    font-family: var(--font-display); font-size: 11px; font-weight: 600; letter-spacing: 1px;
    border: 1px solid;
  }
  .badge-offline { border-color: var(--yellow); color: var(--yellow); background: rgba(255,214,0,0.08); }
  .badge-ready { border-color: var(--green); color: var(--green); background: rgba(0,230,118,0.08); }

  /* MAIN LAYOUT */
  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 0;
    overflow: hidden;
    min-height: 0;
  }

  /* VIDEO AREA */
  .video-area {
    position: relative;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #videoEl {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  #videoEl.mirrored { transform: scaleX(-1); }
  #poseCanvas.mirrored { transform: scaleX(-1); }

  #poseCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  .video-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
  }

  /* Crosshair corners */
  .corner {
    position: absolute;
    width: 24px; height: 24px;
    border-color: var(--red);
    border-style: solid;
    opacity: 0.6;
  }
  .corner-tl { top: 16px; left: 16px; border-width: 2px 0 0 2px; }
  .corner-tr { top: 16px; right: 16px; border-width: 2px 2px 0 0; }
  .corner-bl { bottom: 16px; left: 16px; border-width: 0 0 2px 2px; }
  .corner-br { bottom: 16px; right: 16px; border-width: 0 2px 2px 0; }

  /* Frequency pulse ring */
  .pulse-ring {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 2px solid var(--red);
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,45,45,0.1);
    transition: all 0.15s ease;
    opacity: 0;
  }
  .pulse-ring.active { opacity: 1; }
  .pulse-ring.beat {
    animation: ringPulse 0.3s ease-out forwards;
  }
  .pulse-ring-inner {
    width: 50px; height: 50px;
    border-radius: 50%;
    background: var(--red);
    opacity: 0.8;
    display: flex; align-items: center; justify-content: center;
  }
  @keyframes ringPulse {
    0% { transform: translateX(-50%) scale(1); box-shadow: 0 0 0 0 var(--red-glow); }
    50% { transform: translateX(-50%) scale(1.2); box-shadow: 0 0 0 20px transparent; }
    100% { transform: translateX(-50%) scale(1); }
  }

  /* Status banner */
  .status-banner {
    position: absolute;
    top: 20px; left: 50%; transform: translateX(-50%);
    padding: 8px 20px;
    border-radius: 30px;
    font-family: var(--font-display);
    font-size: 16px; font-weight: 600; letter-spacing: 2px;
    backdrop-filter: blur(12px);
    border: 1px solid;
    transition: all 0.3s ease;
    white-space: nowrap;
    opacity: 0;
    animation: fadeInBanner 0.5s ease forwards;
  }
  .status-banner.show { opacity: 1; }
  .status-banner.good { background: rgba(0,230,118,0.15); border-color: var(--green); color: var(--green); box-shadow: 0 0 20px var(--green-glow); }
  .status-banner.bad { background: rgba(255,45,45,0.15); border-color: var(--red); color: var(--red); box-shadow: 0 0 20px var(--red-glow); }
  .status-banner.warn { background: rgba(255,214,0,0.15); border-color: var(--yellow); color: var(--yellow); }
  @keyframes fadeInBanner { from { opacity: 0; transform: translateX(-50%) translateY(-8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

  /* Start overlay */
  .start-overlay {
    position: absolute;
    inset: 0;
    background: rgba(8,12,15,0.85);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 24px;
    backdrop-filter: blur(4px);
    z-index: 5;
    transition: opacity 0.5s ease;
  }
  .start-overlay.hidden { opacity: 0; pointer-events: none; }

  .start-icon {
    width: 80px; height: 80px;
    background: var(--red);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 40px var(--red-glow);
    animation: breathe 2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 20px var(--red-glow); transform: scale(1); }
    50% { box-shadow: 0 0 50px var(--red-glow); transform: scale(1.05); }
  }
  .start-title { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: 3px; text-align: center; }
  .start-sub { color: var(--text-dim); font-size: 14px; text-align: center; line-height: 1.6; max-width: 280px; }

  .btn-start {
    padding: 14px 40px;
    background: var(--red);
    border: none; border-radius: 30px;
    color: white;
    font-family: var(--font-display); font-size: 18px; font-weight: 700; letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 4px 24px var(--red-glow);
    transition: all 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-start:active { transform: scale(0.96); }

  /* SIDE PANEL */
  .side-panel {
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Tab navigation */
  .tab-nav {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .tab-btn {
    padding: 12px;
    background: none; border: none;
    color: var(--text-dim);
    font-family: var(--font-display); font-size: 13px; font-weight: 600; letter-spacing: 1px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .tab-btn.active { color: var(--red); border-bottom-color: var(--red); }

  .tab-content { flex: 1; overflow-y: auto; padding: 16px; display: none; flex-direction: column; gap: 12px; }
  .tab-content.active { display: flex; }

  /* Metric cards */
  .metric-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    position: relative;
    overflow: hidden;
  }
  .metric-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: var(--red);
    border-radius: 3px 0 0 3px;
  }
  .metric-card.green::before { background: var(--green); }
  .metric-card.yellow::before { background: var(--yellow); }

  .metric-label {
    font-size: 10px; color: var(--text-dim); letter-spacing: 1.5px; text-transform: uppercase;
    font-family: var(--font-display); margin-bottom: 6px;
  }
  .metric-value {
    font-family: var(--font-display); font-size: 36px; font-weight: 700; line-height: 1;
    display: flex; align-items: baseline; gap: 6px;
  }
  .metric-unit { font-size: 14px; font-weight: 400; color: var(--text-dim); }
  .metric-range { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

  /* BPM gauge */
  .bpm-gauge {
    height: 6px; background: var(--border); border-radius: 3px; margin-top: 8px; overflow: hidden;
  }
  .bpm-fill {
    height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--yellow), var(--green), var(--red));
    transition: width 0.5s ease;
    width: 0%;
  }

  /* Posture checks */
  .check-list { display: flex; flex-direction: column; gap: 8px; }
  .check-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    background: var(--surface2); border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 13px;
    transition: all 0.3s ease;
  }
  .check-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-dim); flex-shrink: 0;
    transition: all 0.3s ease;
  }
  .check-item.ok { border-color: rgba(0,230,118,0.2); }
  .check-item.ok .check-dot { background: var(--green); box-shadow: 0 0 6px var(--green-glow); }
  .check-item.fail { border-color: rgba(255,45,45,0.2); }
  .check-item.fail .check-dot { background: var(--red); box-shadow: 0 0 6px var(--red-glow); }

  /* Section label */
  .section-label {
    font-family: var(--font-display); font-size: 11px; font-weight: 600;
    letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase;
    padding: 0 2px;
  }

  /* Score display */
  .score-circle {
    width: 100px; height: 100px;
    border-radius: 50%;
    background: conic-gradient(var(--red) 0%, var(--surface2) 0%);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto;
    position: relative;
    transition: background 0.5s ease;
  }
  .score-inner {
    width: 76px; height: 76px;
    background: var(--surface);
    border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .score-num { font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1; }
  .score-pts { font-size: 10px; color: var(--text-dim); }

  /* History table */
  .history-list { display: flex; flex-direction: column; gap: 6px; }
  .history-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px;
    background: var(--surface2); border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 12px;
  }
  .history-item .h-time { color: var(--text-dim); font-family: var(--font-display); }
  .history-item .h-score { font-family: var(--font-display); font-size: 16px; font-weight: 700; }
  .history-item .h-bpm { color: var(--text-dim); font-size: 11px; }

  /* Bottom controls */
  .controls {
    padding: 12px 16px;
    display: flex; gap: 8px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .btn {
    flex: 1; padding: 10px;
    border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text);
    font-family: var(--font-display); font-size: 13px; font-weight: 600; letter-spacing: 1px;
    cursor: pointer; transition: all 0.2s;
  }
  .btn:active { opacity: 0.7; transform: scale(0.97); }
  .btn-primary { background: var(--red); border-color: var(--red); color: white; box-shadow: 0 2px 12px var(--red-glow); }
  .btn-stop { background: transparent; border-color: rgba(255,45,45,0.4); color: var(--red); }

  /* Loading */
  .loading-bar {
    position: fixed; top: 0; left: 0; height: 2px;
    background: var(--red); width: 0%;
    transition: width 0.3s ease;
    z-index: 100;
    box-shadow: 0 0 8px var(--red);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Landscape iPad optimization */
  @media (max-width: 768px) {
    .main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    .side-panel { max-height: 240px; border-left: none; border-top: 1px solid var(--border); }
    .tab-content { flex-direction: row; flex-wrap: wrap; }
    .metric-card { flex: 1; min-width: 120px; }
  }

  @media (orientation: landscape) and (max-height: 600px) {
    .header { padding: 8px 16px; }
    .logo-text { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="loading-bar" id="loadingBar"></div>

<header class="header">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
        <path d="M12 21.593c-5.63-5.539-11-10.297-11-14.402C1 3.518 3.62 1 6.8 1c1.99 0 3.69.98 5.2 2.82C13.51 1.98 15.21 1 17.2 1 20.38 1 23 3.518 23 7.191c0 4.105-5.37 8.863-11 14.402z"/>
      </svg>
    </div>
    <div>
      <div class="logo-text">CPR TRAINER</div>
      <div class="logo-sub">姿勢辨識訓練系統</div>
    </div>
  </div>
  <div class="header-right">
    <button id="btnFlip" onclick="flipCamera()" style="
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); padding: 6px 12px; cursor: pointer;
      font-family: var(--font-display); font-size: 12px; font-weight: 600; letter-spacing: 1px;
      display: flex; align-items: center; gap: 6px; transition: all 0.2s;
    ">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
        <path d="M8 13h1M15 13h1" stroke-width="2.5"/>
      </svg>
      <span id="btnFlipLabel">後鏡頭</span>
    </button>
    <span class="badge badge-offline" id="statusBadge">● 離線模式</span>
  </div>
</header>

<div class="main">
  <!-- VIDEO AREA -->
  <div class="video-area">
    <video id="videoEl" autoplay playsinline muted></video>
    <canvas id="poseCanvas"></canvas>

    <div class="video-overlay">
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>
    </div>

    <div class="pulse-ring" id="pulseRing">
      <div class="pulse-ring-inner">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="white" stroke="none">
          <path d="M12 21.593c-5.63-5.539-11-10.297-11-14.402C1 3.518 3.62 1 6.8 1c1.99 0 3.69.98 5.2 2.82C13.51 1.98 15.21 1 17.2 1 20.38 1 23 3.518 23 7.191c0 4.105-5.37 8.863-11 14.402z"/>
        </svg>
      </div>
    </div>

    <div class="status-banner" id="statusBanner"></div>

    <!-- Start Overlay -->
    <div class="start-overlay" id="startOverlay">
      <div class="start-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="white">
          <path d="M12 21.593c-5.63-5.539-11-10.297-11-14.402C1 3.518 3.62 1 6.8 1c1.99 0 3.69.98 5.2 2.82C13.51 1.98 15.21 1 17.2 1 20.38 1 23 3.518 23 7.191c0 4.105-5.37 8.863-11 14.402z"/>
        </svg>
      </div>
      <div class="start-title">CPR 訓練系統</div>
      <div class="start-sub">系統將使用攝影機分析您的按壓姿勢、頻率，並提供即時回饋與評分</div>
      <button class="btn-start" id="btnStart" onclick="startSystem()">開始訓練</button>
      <div id="loadingStatus" style="color:var(--text-dim);font-size:12px;text-align:center;"></div>
    </div>
  </div>

  <!-- SIDE PANEL -->
  <div class="side-panel">
    <div class="tab-nav">
      <button class="tab-btn active" onclick="switchTab('live')">即時數據</button>
      <button class="tab-btn" onclick="switchTab('history')">訓練記錄</button>
    </div>

    <!-- LIVE TAB -->
    <div class="tab-content active" id="tab-live">

      <div class="metric-card" id="bpmCard">
        <div class="metric-label">按壓頻率</div>
        <div class="metric-value">
          <span id="bpmValue">--</span>
          <span class="metric-unit">BPM</span>
        </div>
        <div class="bpm-gauge"><div class="bpm-fill" id="bpmFill"></div></div>
        <div class="metric-range">目標：100–120 次/分鐘</div>
      </div>

      <div class="metric-card green" id="scoreCard">
        <div class="metric-label">本次評分</div>
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="score-circle" id="scoreCircle">
            <div class="score-inner">
              <div class="score-num" id="scoreValue">0</div>
              <div class="score-pts">分</div>
            </div>
          </div>
          <div style="flex:1">
            <div style="font-family:var(--font-display);font-size:13px;color:var(--text-dim);margin-bottom:4px">訓練時間</div>
            <div style="font-family:var(--font-display);font-size:22px;font-weight:700" id="timerDisplay">00:00</div>
            <div style="font-size:11px;color:var(--text-dim);margin-top:4px">總按壓次數：<span id="pressCount">0</span></div>
          </div>
        </div>
      </div>

      <div class="section-label">姿勢檢查</div>
      <div class="check-list">
        <div class="check-item" id="check-arms">
          <div class="check-dot"></div>
          <span>手臂伸直（肘關節鎖定）</span>
        </div>
        <div class="check-item" id="check-vertical">
          <div class="check-dot"></div>
          <span>身體垂直施力</span>
        </div>
        <div class="check-item" id="check-position">
          <div class="check-dot"></div>
          <span>雙手位置正確</span>
        </div>
        <div class="check-item" id="check-rhythm">
          <div class="check-dot"></div>
          <span>節奏穩定（100–120 BPM）</span>
        </div>
      </div>

    </div>

    <!-- HISTORY TAB -->
    <div class="tab-content" id="tab-history">
      <div class="section-label">訓練紀錄</div>
      <div class="history-list" id="historyList">
        <div style="color:var(--text-dim);font-size:13px;text-align:center;padding:20px">尚無訓練記錄</div>
      </div>
      <button class="btn" onclick="clearHistory()" style="margin-top:auto;flex-shrink:0">清除記錄</button>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
      <button class="btn btn-stop" id="btnStop" onclick="stopSession()" style="display:none">停止訓練</button>
      <button class="btn btn-primary" id="btnSave" onclick="saveSession()" style="display:none">儲存成績</button>
    </div>
  </div>
</div>

<!-- MediaPipe via CDN (will be cached by SW for offline) -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

<script>
// ============================================================
// STATE
// ============================================================
let pose = null;
let camera = null;
let sessionActive = false;
let sessionStartTime = null;
let timerInterval = null;

// Compression detection
let shoulderYHistory = [];
let lastPressTime = 0;
let pressTimestamps = [];
let pressCount = 0;
let currentBPM = 0;
let bpmHistory = [];

// Posture checks
let postureChecks = { arms: false, vertical: false, position: false, rhythm: false };

// Score
let sessionScore = 0;
let scoreFrames = 0;
let goodFrames = 0;

// History
let sessionHistory = JSON.parse(localStorage.getItem('cprHistory') || '[]');

// Canvas
const canvas = document.getElementById('poseCanvas');
const ctx = canvas.getContext('2d');

// ============================================================
// MEDIAPIPE SETUP
// ============================================================
async function initMediaPipe() {
  setLoadingStatus('正在載入姿勢辨識模型...');
  loadingProgress(30);

  pose = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });

  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    enableSegmentation: false,
    smoothSegmentation: false,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  pose.onResults(onResults);

  setLoadingStatus('正在啟動攝影機...');
  loadingProgress(70);

  await startCamera();

  loadingProgress(100);
  setLoadingStatus('系統就緒 ✓');
  document.getElementById('statusBadge').textContent = '● 就緒';
  document.getElementById('statusBadge').className = 'badge badge-ready';
}

// ============================================================
// CAMERA MANAGEMENT
// ============================================================
let currentFacing = 'environment'; // 'user' = 前鏡頭, 'environment' = 後鏡頭
let currentStream = null;

async function startCamera() {
  const videoEl = document.getElementById('videoEl');

  // Stop existing stream
  if (currentStream) {
    currentStream.getTracks().forEach(t => t.stop());
    currentStream = null;
  }
  if (camera) {
    try { camera.stop(); } catch(e) {}
    camera = null;
  }

  try {
    currentStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: currentFacing, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    videoEl.srcObject = currentStream;
    await videoEl.play();

    // Mirror video + canvas for front camera only
    const isFront = currentFacing === 'user';
    videoEl.classList.toggle('mirrored', isFront);
    canvas.classList.toggle('mirrored', isFront);

    camera = new Camera(videoEl, {
      onFrame: async () => {
        if (sessionActive) await pose.send({ image: videoEl });
      },
      width: 1280, height: 720
    });
    await camera.start();
  } catch (err) {
    setLoadingStatus('⚠ 攝影機存取失敗：' + err.message);
    console.error(err);
  }
}

async function flipCamera() {
  const btn = document.getElementById('btnFlip');
  const label = document.getElementById('btnFlipLabel');
  btn.style.opacity = '0.5';
  btn.style.pointerEvents = 'none';

  currentFacing = currentFacing === 'environment' ? 'user' : 'environment';
  label.textContent = currentFacing === 'user' ? '前鏡頭 ✓' : '後鏡頭 ✓';

  await startCamera();

  btn.style.opacity = '1';
  btn.style.pointerEvents = '';
}

function loadingProgress(pct) {
  document.getElementById('loadingBar').style.width = pct + '%';
}
function setLoadingStatus(msg) {
  document.getElementById('loadingStatus').textContent = msg;
}

// ============================================================
// POSE RESULTS
// ============================================================
function onResults(results) {
  const videoEl = document.getElementById('videoEl');
  canvas.width = videoEl.videoWidth || canvas.offsetWidth;
  canvas.height = videoEl.videoHeight || canvas.offsetHeight;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!results.poseLandmarks) return;

  const lm = results.poseLandmarks;

  // Draw skeleton
  drawConnectors(ctx, lm, POSE_CONNECTIONS, { color: 'rgba(255,255,255,0.3)', lineWidth: 2 });
  drawLandmarks(ctx, lm, { color: '#FF2D2D', fillColor: 'rgba(255,45,45,0.5)', radius: 4, lineWidth: 1 });

  // Analyze posture
  analyzePose(lm);
}

function analyzePose(lm) {
  if (!sessionActive) return;

  // Key landmarks
  const lShoulder = lm[11], rShoulder = lm[12];
  const lElbow = lm[13], rElbow = lm[14];
  const lWrist = lm[15], rWrist = lm[16];
  const lHip = lm[23], rHip = lm[24];

  if (!lShoulder || !rShoulder || !lElbow || !rElbow || !lWrist || !rWrist) return;

  // --- 1. ARM STRAIGHTNESS ---
  const lArmAngle = getAngle(lShoulder, lElbow, lWrist);
  const rArmAngle = getAngle(rShoulder, rElbow, rWrist);
  const armsStr = lArmAngle > 155 && rArmAngle > 155;
  postureChecks.arms = armsStr;

  // --- 2. VERTICAL POSITION (shoulder over wrist) ---
  const avgWristX = (lWrist.x + rWrist.x) / 2;
  const avgShoulderX = (lShoulder.x + rShoulder.x) / 2;
  const xOffset = Math.abs(avgWristX - avgShoulderX);
  postureChecks.vertical = xOffset < 0.12;

  // --- 3. HAND POSITION (wrists close together) ---
  const wristDist = Math.hypot(lWrist.x - rWrist.x, lWrist.y - rWrist.y);
  postureChecks.position = wristDist < 0.12;

  // --- 4. COMPRESSION DETECTION (shoulder Y movement) ---
  const avgShoulderY = (lShoulder.y + rShoulder.y) / 2;
  shoulderYHistory.push({ y: avgShoulderY, t: Date.now() });
  if (shoulderYHistory.length > 30) shoulderYHistory.shift();

  detectCompression();

  // --- 5. RHYTHM CHECK ---
  postureChecks.rhythm = currentBPM >= 90 && currentBPM <= 130;

  // --- Update UI ---
  updateChecks();
  updateBPM();
  updateScore();
  updateStatusBanner();
}

function detectCompression() {
  if (shoulderYHistory.length < 6) return;

  const recent = shoulderYHistory.slice(-6);
  const yVals = recent.map(h => h.y);
  const maxY = Math.max(...yVals);
  const minY = Math.min(...yVals);
  const range = maxY - minY;

  // Detect downward peak (compression)
  if (range > 0.015) {
    const midIdx = Math.floor(yVals.length / 2);
    const isValley = yVals[midIdx] <= yVals[0] + 0.005 && yVals[midIdx] <= yVals[yVals.length-1] + 0.005;

    if (isValley) {
      const now = Date.now();
      if (now - lastPressTime > 300) { // debounce 300ms
        lastPressTime = now;
        pressCount++;
        document.getElementById('pressCount').textContent = pressCount;

        pressTimestamps.push(now);
        pressTimestamps = pressTimestamps.filter(t => now - t < 6000);

        if (pressTimestamps.length >= 2) {
          const intervals = [];
          for (let i = 1; i < pressTimestamps.length; i++) {
            intervals.push(pressTimestamps[i] - pressTimestamps[i-1]);
          }
          const avgInterval = intervals.reduce((a,b)=>a+b,0)/intervals.length;
          currentBPM = Math.round(60000 / avgInterval);
          bpmHistory.push(currentBPM);
          if (bpmHistory.length > 20) bpmHistory.shift();
        }

        // Visual pulse
        triggerPulse();
      }
    }
  }
}

function getAngle(a, b, c) {
  const ab = { x: a.x - b.x, y: a.y - b.y };
  const cb = { x: c.x - b.x, y: c.y - b.y };
  const dot = ab.x * cb.x + ab.y * cb.y;
  const magAB = Math.sqrt(ab.x**2 + ab.y**2);
  const magCB = Math.sqrt(cb.x**2 + cb.y**2);
  if (magAB * magCB === 0) return 0;
  return Math.acos(Math.max(-1, Math.min(1, dot / (magAB * magCB)))) * (180 / Math.PI);
}

// ============================================================
// UI UPDATES
// ============================================================
function updateChecks() {
  const items = ['arms', 'vertical', 'position', 'rhythm'];
  items.forEach(key => {
    const el = document.getElementById('check-' + key);
    if (postureChecks[key]) {
      el.className = 'check-item ok';
    } else {
      el.className = 'check-item fail';
    }
  });
}

function updateBPM() {
  const el = document.getElementById('bpmValue');
  const fill = document.getElementById('bpmFill');
  const card = document.getElementById('bpmCard');

  if (currentBPM === 0) {
    el.textContent = '--';
    fill.style.width = '0%';
    return;
  }

  el.textContent = currentBPM;

  // 60–160 BPM range displayed
  const pct = Math.min(100, Math.max(0, ((currentBPM - 60) / 100) * 100));
  fill.style.width = pct + '%';

  if (currentBPM >= 100 && currentBPM <= 120) {
    card.style.setProperty('--c', 'var(--green)');
    el.style.color = 'var(--green)';
  } else if (currentBPM >= 90 && currentBPM <= 130) {
    el.style.color = 'var(--yellow)';
  } else {
    el.style.color = 'var(--red)';
  }
}

function updateScore() {
  scoreFrames++;
  const checksPassed = Object.values(postureChecks).filter(Boolean).length;
  if (checksPassed >= 3) goodFrames++;

  sessionScore = Math.round((goodFrames / scoreFrames) * 100);

  const scoreEl = document.getElementById('scoreValue');
  scoreEl.textContent = sessionScore;

  // Update conic gradient
  const circle = document.getElementById('scoreCircle');
  let color = sessionScore >= 80 ? 'var(--green)' : sessionScore >= 60 ? 'var(--yellow)' : 'var(--red)';
  circle.style.background = `conic-gradient(${color} ${sessionScore * 3.6}deg, var(--surface2) 0deg)`;
}

function updateStatusBanner() {
  const banner = document.getElementById('statusBanner');
  const checksPassed = Object.values(postureChecks).filter(Boolean).length;

  banner.classList.add('show');

  if (checksPassed === 4) {
    banner.textContent = '✓ 姿勢正確';
    banner.className = 'status-banner show good';
  } else if (!postureChecks.arms) {
    banner.textContent = '⚠ 手臂需伸直';
    banner.className = 'status-banner show bad';
  } else if (!postureChecks.rhythm && currentBPM > 0) {
    const msg = currentBPM < 100 ? '⚡ 加快頻率' : '⚠ 放慢頻率';
    banner.textContent = msg;
    banner.className = 'status-banner show warn';
  } else if (!postureChecks.vertical) {
    banner.textContent = '⚠ 調整按壓角度';
    banner.className = 'status-banner show warn';
  } else {
    banner.textContent = '繼續保持...';
    banner.className = 'status-banner show';
  }
}

function triggerPulse() {
  const ring = document.getElementById('pulseRing');
  ring.classList.add('active');
  ring.classList.remove('beat');
  void ring.offsetWidth;
  ring.classList.add('beat');
}

// ============================================================
// SESSION CONTROL
// ============================================================
async function startSystem() {
  const btn = document.getElementById('btnStart');
  btn.textContent = '載入中...';
  btn.disabled = true;
  await initMediaPipe();
  startSession();
}

function startSession() {
  document.getElementById('startOverlay').classList.add('hidden');
  document.getElementById('btnStop').style.display = '';
  document.getElementById('btnSave').style.display = '';

  sessionActive = true;
  sessionStartTime = Date.now();
  pressCount = 0;
  pressTimestamps = [];
  currentBPM = 0;
  scoreFrames = 0;
  goodFrames = 0;
  shoulderYHistory = [];
  bpmHistory = [];

  document.getElementById('pressCount').textContent = '0';
  document.getElementById('bpmValue').textContent = '--';
  document.getElementById('scoreValue').textContent = '0';

  timerInterval = setInterval(updateTimer, 1000);
}

function stopSession() {
  sessionActive = false;
  clearInterval(timerInterval);
  document.getElementById('btnStop').style.display = 'none';
  document.getElementById('pulseRing').classList.remove('active');

  const banner = document.getElementById('statusBanner');
  banner.textContent = '訓練結束 — 儲存成績';
  banner.className = 'status-banner show warn';
}

function saveSession() {
  const duration = sessionStartTime ? Math.floor((Date.now() - sessionStartTime) / 1000) : 0;
  const entry = {
    time: new Date().toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
    score: sessionScore,
    bpm: currentBPM || (bpmHistory.length ? Math.round(bpmHistory.reduce((a,b)=>a+b)/bpmHistory.length) : 0),
    duration: duration,
    presses: pressCount
  };

  sessionHistory.unshift(entry);
  if (sessionHistory.length > 20) sessionHistory = sessionHistory.slice(0, 20);
  localStorage.setItem('cprHistory', JSON.stringify(sessionHistory));

  renderHistory();
  switchTab('history');

  document.getElementById('btnSave').style.display = 'none';

  // Start new session
  setTimeout(() => {
    document.getElementById('startOverlay').classList.remove('hidden');
    document.getElementById('btnStart').textContent = '再次訓練';
    document.getElementById('btnStart').disabled = false;
    document.getElementById('statusBanner').classList.remove('show');
  }, 800);
}

function updateTimer() {
  const elapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
  const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const s = String(elapsed % 60).padStart(2, '0');
  document.getElementById('timerDisplay').textContent = `${m}:${s}`;
}

// ============================================================
// HISTORY
// ============================================================
function renderHistory() {
  const list = document.getElementById('historyList');
  if (!sessionHistory.length) {
    list.innerHTML = '<div style="color:var(--text-dim);font-size:13px;text-align:center;padding:20px">尚無訓練記錄</div>';
    return;
  }
  list.innerHTML = sessionHistory.map(h => {
    const scoreColor = h.score >= 80 ? 'var(--green)' : h.score >= 60 ? 'var(--yellow)' : 'var(--red)';
    return `<div class="history-item">
      <div>
        <div style="font-weight:500;margin-bottom:2px">${h.time}</div>
        <div class="h-bpm">${h.presses} 次 · ${formatDur(h.duration)} · ${h.bpm} BPM</div>
      </div>
      <div class="h-score" style="color:${scoreColor}">${h.score}</div>
    </div>`;
  }).join('');
}

function formatDur(sec) {
  const m = Math.floor(sec/60), s = sec%60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function clearHistory() {
  sessionHistory = [];
  localStorage.removeItem('cprHistory');
  renderHistory();
}

// ============================================================
// TAB
// ============================================================
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', (i === 0 && tab === 'live') || (i === 1 && tab === 'history'));
  });
  document.getElementById('tab-live').classList.toggle('active', tab === 'live');
  document.getElementById('tab-history').classList.toggle('active', tab === 'history');
}

// Init
renderHistory();
</script>
